# The eval set (PLAN 3.5, requirements §7): the companies `primer eval-set` runs and scores.
#
# Each entry:
#   name        company name passed to `primer run --company` (for a private company the legal
#               name: it is how filings and USAspending know it)
#   aliases     everyday names (`primer run --alias`), also accepted by `eval-set --only`
#   ticker      ticker, or null for a name-only (private) run; it also names the output folder
#               (output/{TICKER}/ or output/{slug-of-name}/) and is what `--only` matches
#   kind        golden: a reference primer exists (the judge and fact overlap compare against it)
#               rubric: no reference; the judge scores against the cited sources and the rubric,
#               and a self-consistency block checks the run's own numbers
#   golden      reference primer, relative to the repo root (GOLDEN_DIR overrides the folder).
#               The .md/.pdf references are licensed and never committed; when the file is
#               missing the entry is scored as a rubric entry and the row says so.
#   golden_financials   optional JSON of section-9 figures to match to the dollar
#   flags       Inputs fields for the run: private, offline, debug
#   as_of       YYYY-MM-DD; omit for the run date
#   sections    e.g. "1-14" or "1,9"; omit for all
#   sector      label for the table
#   note        free text carried into the report
#   expect      checks on the finished run (all must hold):
#                 section<N>: coverage status, or a list of acceptable statuses
#                 fiscal_year_end: "1231"        entity fiscal year end (MMDD, quote it)
#                 sector_tag: aerospace_defense  tag resolve_entity assigned from the SIC code
#                 is_public: true|false
#                 gate: pass|fail                the validation gate
#                 self_consistency: pass|fail    balance-sheet / FCF / revenue / FY-label checks
#                 min_judge_mean, min_judge_min, financials_exact (>= value),
#                 max_undated_share, min_tier1_share (numbers)
#
# Adding a company is a new entry here and nothing else. Adding a sector is a sources.yaml
# change (sectors, trade_press, sector_briefs, peer_fallbacks).

defaults:
  # a section the judge model scores below this fails the entry (applies when a judge model is
  # configured; the template-mode fallback reads the deterministic critic scores instead)
  judge_min: 3.0
  # an entry fails when its self-consistency block fails (rubric entries; golden entries are
  # compared with the reference instead)
  require_self_consistency_for: [rubric]

entries:
  - name: Lockheed Martin
    ticker: LMT
    kind: golden
    golden: docs/golden/lmt.md
    golden_financials: docs/golden/lmt_financials.json
    flags: {}
    as_of: "2026-10-21"
    sector: aerospace_defense
    expect:
      sector_tag: aerospace_defense
      fiscal_year_end: "1231"
      section4: [full, partial]
      section9: full

  - name: Boeing
    ticker: BA
    kind: golden
    golden: docs/golden/ba.md
    flags: {}
    as_of: "2026-10-21"
    sector: aerospace_defense
    expect:
      sector_tag: aerospace_defense
      fiscal_year_end: "1231"
      section9: full

  - name: Space Exploration Technologies Corp
    aliases: [SpaceX]
    ticker: SPCX
    kind: golden
    golden: docs/golden/spacex.md
    flags: {}
    as_of: "2026-10-23"
    sector: aerospace_defense
    note: >-
      Listed in June 2026 (CIK 1181412), so it runs on the public path. It has no 10-K yet (first
      one due early 2027), so the foundation pack reads its IPO prospectus under the 10-K item
      numbers and sections 9, 11 and 13 come from 10-Q facts: section 9 and the capital and
      valuation sections stay partial, never full, because no fiscal year of filed financials
      exists. The private-company path is covered by the fixture tests in tests/test_private.py.
    expect:
      is_public: true
      section9: [full, partial]
      section4: [full, partial]

  - name: Anduril Industries, Inc.
    aliases: [Anduril]
    ticker: null
    kind: rubric
    flags:
      private: true
    as_of: "2026-10-24"
    sector: aerospace_defense
    note: >-
      A private defense company with a large federal business and no SEC registrant: the
      private path on a company whose awards matter (USAspending, SAM.gov) and whose
      acquisitions rarely state a price. Section 4 must group the awards into programs from the
      award descriptions, section 7 must list acquisitions with the value undisclosed, and
      sections 9, 11 and 13 must stay press-reported and unaudited. Funding-round and valuation
      marks diverge widely by source and must be shown as a range, not reconciled.
    expect:
      is_public: false
      section4: [full, partial]
      section9: [partial, unavailable]
      section11: [partial, unavailable]
      section13: [partial, unavailable]

  - name: Northrop Grumman
    ticker: NOC
    kind: rubric
    flags: {}
    as_of: "2026-10-22"
    sector: aerospace_defense
    note: >-
      The requirements' open question for the Key Programs section: Sentinel and B-21 are the
      newest and least-tested part of section 4. No reference primer exists, so the judge scores
      against the cited sources and the rubric.
    expect:
      sector_tag: aerospace_defense
      fiscal_year_end: "1231"
      section4: [full, partial]
      section9: full
      self_consistency: pass

  - name: L3Harris Technologies
    ticker: LHX
    kind: rubric
    flags: {}
    as_of: "2026-10-22"
    sector: aerospace_defense
    note: >-
      52/53-week fiscal year ending on the Friday nearest 31 December (2022-12-30, 2023-12-29,
      2025-01-03, 2026-01-02): the fiscal-year labelling and balance-sheet dating test. Four
      consecutive fiscal years, FY2022 to FY2025, must come out with revenue in each.
    expect:
      sector_tag: aerospace_defense
      section9: full
      self_consistency: pass
