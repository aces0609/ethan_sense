# Per-section budgets (requirements §8). A section that hits a cap stops and is marked partial.
# pages: the AlphaSense page estimate (§2); the validator flags >50% over.
#
# Credits: the Firecrawl free plan carries 1,000 credits per month and allows 2 concurrent
# requests. A /search costs 2 per 10 results, a /scrape 1, a /scrape with a JSON schema 5,
# a /map 1, a PDF parse 1 per page. Firecrawl responses are cached for 7 days, so a rerun
# of the same company costs nothing.
#
# 2026-10-22 (review §9 fix 6): the Phase 2 runs spent 2 to 170 credits of the 420 per-primer
# cap while sections 3, 5, 6, 12 and 14 all reported dropped queries and "scrape cap 6
# reached"; the per-section caps bound long before the per-primer cap did. Those five
# sections now get roughly double their room (searches 4→8 / 3→6, scrapes 6→12, credits
# 20→40 / 16→32). Section 4 and the foundation budget are unchanged. Arithmetic for a
# 13-section run (sections 2–14), credits:
#   sections 2..14 = 12+40+40+40+40+16+16+14+14+16+40+16+32 = 336 (was 227)
#   + foundation 30 + market_data 40 = 406 < 420 per-primer cap (14 spare; sections 9 and 13 are raised for the private path and spend little on public companies)
# A section's expected spend is below its cap: 8 searches × 2 + 12 scrapes × 1 = 28 of 40,
# the rest is headroom for PDF parses (1 per page) and the occasional JSON-schema scrape.
defaults:
  searches: 4            # Firecrawl /search calls per section
  scrapes: 8             # Firecrawl /scrape or /parse calls per section
  credits: 24            # Firecrawl credits per section
  tokens: 40000          # model tokens per section research loop
  critic_loops: 2
  pages: 1.5
  hits_per_search: 8     # results requested per /search (2 credits up to 10)

foundation:
  searches: 5            # one per transcript quarter + one spare
  scrapes: 10            # transcripts, webcast PDFs
  credits: 30

market_data:
  credits: 40            # six aggregator pages with JSON schemas, scraped once per run

per_primer:
  tokens: 600000        # measured: a full pass with two critic iterations needs ~450k on Claude Opus
  credits: 420
  samgov_calls: 10
  wall_clock_minutes: 30

sections:
  1:  {pages: 1.0, searches: 0, scrapes: 0, credits: 0}
  2:  {pages: 1.5, searches: 2, scrapes: 4, credits: 12}
  3:  {pages: 2.0, searches: 8, scrapes: 12, credits: 40}   # was 4 / 6 / 20
  4:  {pages: 2.0, searches: 6, scrapes: 10, credits: 40, use_agent: false}
  5:  {pages: 2.0, searches: 8, scrapes: 12, credits: 40}   # was 4 / 6 / 20
  6:  {pages: 2.0, searches: 6, scrapes: 12, credits: 40}   # was 3 / 6 / 20
  7:  {pages: 1.0, searches: 3, scrapes: 5, credits: 16}
  8:  {pages: 1.0, searches: 3, scrapes: 5, credits: 16}
  9:  {pages: 1.5, searches: 3, scrapes: 4, credits: 14}   # public: XBRL only (spends ~0); private: press figures need the room
  10: {pages: 2.0, searches: 3, scrapes: 4, credits: 14}
  11: {pages: 1.5, searches: 3, scrapes: 5, credits: 16}
  12: {pages: 2.5, searches: 8, scrapes: 12, credits: 40}   # was 4 / 6 / 20; pages 2.5: the AlphaSense thesis sections run ~4 pages (2026-10-22)
  13: {pages: 1.5, searches: 3, scrapes: 5, credits: 16}   # private path: funding rounds and valuation
  14: {pages: 1.0, searches: 6, scrapes: 12, credits: 32}   # was 3 / 6 / 16
  # 15: awards by agency. No web search; USAspending calls cost no Firecrawl credits. samgov_calls is
  # how many SAM.gov requests the section may spend (a personal key has 10 a day, shared with the
  # entity lookups of section 4; a key whose owner has a SAM.gov role has 1,000).
  15: {pages: 2.0, searches: 0, scrapes: 0, credits: 0, samgov_calls: 8}

# Larger caps for a private company, whose sections 7, 8, 10, 11 and 13 rest on the web alone
# (the public caps above assume filings do the work). 2026-10-24, Anduril: sections 7 and 8 hit
# "scrape cap 5 reached" and named one acquisition and one executive. Credits for a private run,
# sections 2..14 = 12+40+40+40+40+32+26+14+20+20+40+24+32 = 380, + foundation 30 = 410 < 420
# (no market-data pages for a private company).
private_sections:
  7:  {searches: 6, scrapes: 10, credits: 32}
  8:  {searches: 5, scrapes: 8, credits: 26}
  10: {searches: 4, scrapes: 6, credits: 20}
  11: {searches: 4, scrapes: 6, credits: 20}
  13: {searches: 4, scrapes: 8, credits: 24}

# Numeric-consistency tolerance by metric family (fraction of the larger value).
numeric_tolerance:
  default: 0.005
  ratio: 0.02
  count: 0.0
