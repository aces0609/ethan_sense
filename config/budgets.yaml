# Per-section budgets (requirements §8). A section that hits a cap stops and is marked partial.
# pages: the AlphaSense page estimate (§2); the validator flags >50% over.
defaults:
  searches: 6            # Firecrawl /search calls per section
  scrapes: 12            # Firecrawl /scrape or /parse calls per section
  credits: 40            # Firecrawl credits per section
  tokens: 40000          # model tokens per section research loop
  critic_loops: 2
  pages: 1.5

per_primer:
  tokens: 400000
  credits: 600
  samgov_calls: 10
  wall_clock_minutes: 30

sections:
  1:  {pages: 1.0, searches: 0, scrapes: 0, credits: 0}
  2:  {pages: 1.5}
  3:  {pages: 2.0}
  4:  {pages: 2.0, searches: 8, scrapes: 16, credits: 60}
  5:  {pages: 2.0}
  6:  {pages: 2.0}
  7:  {pages: 1.0}
  8:  {pages: 1.0}
  9:  {pages: 1.5, searches: 1, scrapes: 2, credits: 5}
  10: {pages: 2.0}
  11: {pages: 1.5}
  12: {pages: 2.0}
  13: {pages: 1.5}
  14: {pages: 1.0}

# Numeric-consistency tolerance by metric family (fraction of the larger value).
numeric_tolerance:
  default: 0.005
  ratio: 0.02
  count: 0.0
