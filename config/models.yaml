# Model roles (requirements §5 "Model roles").
#
# `provider` picks the block under `providers`; a role maps to that provider's strong or
# cheap model. When the chosen provider's key env var is unset, every role falls back to
# "template" (the deterministic writer: exhibits and claims are built, narrative is not).
# Endpoints come from the provider's base_url_env so a proxy or compatible gateway is a
# one-line .env change; the standard endpoints are the defaults in .env.example.
#
# Temperature: both current providers reject an explicit temperature (OpenAI GPT-5-family
# reasoning models, and Anthropic Claude 5.5 models return "`temperature` is deprecated for
# this model"), so it is left unset and the requirements §8 determinism target rests on the
# plan, queries and evidence logged in run.json. Set `temperature: 0` on a provider whose
# models still accept it.

provider: openai   # production path; PRIMER_MODEL_PROVIDER in .env overrides locally

providers:
  openai:
    key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    strong: openai:gpt-5.4
    cheap: openai:gpt-5.4-mini
    temperature: null
  anthropic:
    key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    strong: anthropic:claude-opus-5-5
    cheap: anthropic:claude-haiku-5-5
    temperature: null

roles:
  planner:        {tier: strong}   # plan_sections
  query_planner:  {tier: cheap}    # plan_queries inside each researcher
  tool_loop:      {tier: cheap}    # call_tools ReAct loop
  drafter:        {tier: strong}   # compress_and_draft
  critic:         {tier: strong}   # critic
  synthesizer:    {tier: strong}   # key_takeaways
  judge:          {tier: strong}   # eval harness rubric
